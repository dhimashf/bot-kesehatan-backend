version: '3.8'
services:
  psikobot:
    image: ghcr.io/dhimashf/psiko-bot:v1.0.6
    container_name: psikobot-container
    restart: unless-stopped
    ports:
      - "8010:8010"
    
    # Volume untuk persist cache model (opsional tapi recommended)
    volumes:
      - hf_cache:/app/cache
    
    environment:
      # Konfigurasi
      ANONYMIZED_TELEMETRY: "false"
      BACKEND_API_URL: "https://psikobot.difunand.cloud"
      INTERNAL_API_HOST: "localhost"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8010"
      DEBUG: "True"
      
      # Secrets
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      
      # CRITICAL: Cache directories untuk Hugging Face
      HOME: /app
      HF_HOME: /app/huggingface_cache
      SENTENCE_TRANSFORMERS_HOME: /app/huggingface_cache
      TRANSFORMERS_CACHE: /app/huggingface_cache
      TORCH_HOME: /app/huggingface_cache
      XDG_CACHE_HOME: /app/huggingface_cache
      
      # Tambahan: Nonaktifkan symlinks
      HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
    
    # PENTING: User yang menjalankan container
    # Jika Dockerfile tidak set USER, uncomment ini:
    # user: "1000:1000"

# Volume untuk persist model cache (tidak perlu download ulang setiap restart)
volumes:
  hf_cache:
  